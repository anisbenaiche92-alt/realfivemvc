<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement | RealFive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { 
    neon: '#EF1A2D', // Vrai rouge sportif (Scuderia Ferrari)
    anthracite: '#1F2937', // Gris anthracite pur
    black: '#080808', 
    sidebar: '#0C0C0C' 
}, fontFamily: { orbitron: ['Orbitron'], inter: ['Inter'] } } } }
    </script>
    <link rel="stylesheet" href="/css/payment.css">
</head>
<body class="h-screen flex items-center justify-center font-inter bg-[url('image/reservation.jpg')] bg-cover bg-center bg-no-repeat">
    
    <div class="absolute inset-0 bg-black/90 backdrop-blur-sm"></div>

    <div class="relative w-full max-w-lg bg-[#111] border border-white/10 rounded-2xl p-6 sm:p-8 shadow-[0_0_50px_rgba(0,0,0,0.8)] mx-4 animate-fade-in">
        
        <div class="text-center mb-8">
            <h1 class="font-orbitron font-black text-2xl sm:text-3xl text-white mb-2">CAISSE <span class="text-neon">REALFIVE</span></h1>
            <p class="text-gray-400 text-sm">Finalise ton inscription pour entrer sur le terrain.</p>
        </div>

        <div class="bg-white/5 rounded-xl p-4 mb-6 border border-white/5 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-center sm:text-left">
                <div class="text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-1">MATCH</div>
                <div class="font-orbitron text-lg text-white font-bold" id="match-code">...</div>
                <div class="text-xs text-gray-400 mt-1" id="match-date">...</div>
            </div>
            <div class="text-center sm:text-right">
                <div class="text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-1">TOTAL À PAYER</div>
                <div class="font-orbitron text-2xl text-neon font-black" id="amount-due">-- €</div>
            </div>
        </div>

        <div class="mb-6">
            <div class="flex flex-col sm:flex-row gap-2 bg-black/50 p-1 rounded-lg border border-white/10 focus-within:border-neon transition">
                <div class="flex items-center pl-3 text-gray-500">
                    <i class="fa-solid fa-tag"></i>
                </div>
                <input type="text" id="promo-input" placeholder="CODE PROMO..." class="flex-1 bg-transparent text-white font-orbitron text-sm uppercase outline-none placeholder-gray-600 py-2 px-2">
                <button onclick="applyPromo()" class="bg-white/10 hover:bg-neon hover:text-black text-white px-4 py-2 rounded font-bold text-xs transition uppercase whitespace-nowrap">
                    Appliquer
                </button>
            </div>
            <div id="promo-msg" class="text-[10px] mt-2 hidden text-right font-bold"></div>
        </div>

        <div id="payment-methods" class="space-y-3 mb-8">
            <div class="payment-option rounded-lg p-4 flex items-center justify-between group disabled opacity-50 cursor-not-allowed bg-white/5 border border-transparent">
                <div class="flex items-center gap-3">
                    <div class="bg-white/10 p-2 rounded text-xl">💳</div>
                    <div>
                        <div class="font-bold text-sm text-gray-400">Carte Bancaire</div>
                        <div class="text-[10px] text-gray-600">Bientôt disponible</div>
                    </div>
                </div>
                <div class="w-4 h-4 rounded-full border border-gray-600"></div>
            </div>

            <div class="payment-option rounded-lg p-4 flex items-center justify-between group disabled opacity-50 cursor-not-allowed bg-white/5 border border-transparent">
                <div class="flex items-center gap-3">
                    <div class="bg-[#003087]/20 p-2 rounded text-xl text-[#003087]">🅿️</div>
                    <div>
                        <div class="font-bold text-sm text-gray-400">PayPal</div>
                        <div class="text-[10px] text-gray-600">Bientôt disponible</div>
                    </div>
                </div>
                <div class="w-4 h-4 rounded-full border border-gray-600"></div>
            </div>

            <div onclick="selectMethod('cash')" id="btn-cash" class="payment-option rounded-lg p-4 flex items-center justify-between border border-neon/30 bg-neon/5 cursor-pointer hover:bg-neon/10 transition">
                <div class="flex items-center gap-3">
                    <div class="bg-neon/20 p-2 rounded text-xl">💵</div>
                    <div>
                        <div class="font-bold text-sm text-white">Espèces / Sur Place</div>
                        <div class="text-[10px] text-neon">Paiement validé immédiatement</div>
                    </div>
                </div>
                <div class="w-4 h-4 rounded-full border border-neon bg-neon shadow-[0_0_10px_#4DFF99]"></div>
            </div>
        </div>

        <button id="pay-btn" onclick="processPayment()" class="w-full bg-neon text-black font-orbitron font-black text-base sm:text-lg py-3 sm:py-4 rounded-lg uppercase tracking-widest hover:scale-[1.02] transition shadow-lg shadow-neon/20">
            VALIDER & REJOINDRE
        </button>
        
        <p class="text-center text-[10px] text-gray-600 mt-4">En validant, tu acceptes les CGV de RealFive Arena.</p>
    </div>
        
    <script src="/js/payment.js"></script>
</body>
</html>
