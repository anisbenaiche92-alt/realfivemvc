<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau Mot de Passe | RealFive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { neon: '#4DFF99' }, fontFamily: { orbitron: ['Orbitron'], inter: ['Inter'] } } } }
    </script>
    <link rel="stylesheet" href="/css/reset-password.css">
</head>
<body class="h-screen flex items-center justify-center font-inter">
    
    <div class="w-full max-w-md p-8 bg-[#111] border border-white/10 rounded-lg shadow-[0_0_20px_rgba(77,255,153,0.1)]">
        <h1 class="font-orbitron text-xl text-center mb-6 font-bold text-neon">RÉINITIALISATION</h1>
        
        <form onsubmit="handleReset(event)" class="space-y-4">
            <input type="password" id="new_pass" placeholder="Nouveau mot de passe" class="w-full p-3 bg-[#080808] border border-white/20 rounded text-white focus:border-neon focus:outline-none" required>
            <input type="password" id="confirm_pass" placeholder="Confirmer le mot de passe" class="w-full p-3 bg-[#080808] border border-white/20 rounded text-white focus:border-neon focus:outline-none" required>
            
            <button type="submit" id="btn" class="w-full py-3 bg-neon text-black font-orbitron font-bold uppercase tracking-widest hover:shadow-[0_0_15px_rgba(77,255,153,0.4)] transition">
                Valider
            </button>
        </form>
        <p id="msg" class="text-center text-xs mt-4 font-bold"></p>
    </div>
    <script src="/js/reset-password.js"></script>
</body>
</html>
