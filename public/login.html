<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealFive ID | Accès Membre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
    neon: '#EF1A2D', // Vrai rouge sportif (Scuderia Ferrari)
    anthracite: '#1F2937', // Gris anthracite pur
    black: '#080808', 
    sidebar: '#0C0C0C' 
},
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body class="font-inter h-screen flex items-center justify-center relative">

    <div class="noise-overlay"></div>
    <div class="ambient-glow"></div>

    <a href="/" class="absolute top-8 left-8 text-gray-500 hover:text-white transition flex items-center gap-2 z-50 text-xs uppercase tracking-widest font-bold">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Retour Arena
    </a>

    <div class="relative w-full max-w-md p-8 z-10">
        
        <div class="text-center mb-8">
            <h1 class="font-orbitron text-2xl font-bold tracking-tight">REALFIVE ID</h1>
            <p class="text-gray-500 text-xs uppercase tracking-[0.2em] mt-2">Portail Joueur</p>
        </div>

        <div class="flex bg-[#111] p-1 rounded-lg mb-8 border border-white/10">
            <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2 text-xs font-bold uppercase tracking-widest rounded bg-[#222] text-white transition-all shadow-lg">Connexion</button>
            <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-2 text-xs font-bold uppercase tracking-widest rounded text-gray-500 hover:text-white transition-all">Inscription</button>
        </div>

      <form id="authForm" onsubmit="handleSubmit(event)" class="space-y-4 animate-fade-in relative">
    
    <div id="register-fields" class="hidden space-y-4">
        <div class="flex gap-4">
            <input type="text" id="first_name" placeholder="Prénom" class="input-field">
            <input type="text" id="last_name" placeholder="Nom" class="input-field">
        </div>
        <input type="tel" id="phone" placeholder="Téléphone (ex: 0612345678)" class="input-field">
        <div class="relative">
            <input type="text" id="referral_code" placeholder="Code Parrain (Optionnel)" class="input-field border-neon/30 text-neon placeholder-gray-600">
        </div>
    </div>

    <div id="credentials-fields">
        <input type="email" id="email" placeholder="Email" class="input-field mb-4" required>
        
        <div id="password-container">
            <input type="password" id="password" placeholder="Mot de passe" class="input-field" required>
            <input type="password" id="confirm_password" placeholder="Confirmer MDP" class="input-field mt-4 hidden">
            
            <div class="flex justify-end mt-2">
                <button type="button" onclick="toggleRecoveryMode()" id="forgot-link" class="text-[10px] text-gray-500 hover:text-neon uppercase tracking-wide transition font-bold">
                    Mot de passe oublié ?
                </button>
            </div>
        </div>
    </div>

    <div id="otp-section" class="hidden text-center">
        <input type="text" id="otp_code" placeholder="0 0 0 0 0 0" class="input-field text-center text-xl tracking-[0.5em] font-orbitron" maxlength="6">
    </div>

    <button type="submit" id="submit-btn" class="btn-action mt-6">
        Entrer dans l'arène
    </button>
</form>

        <div id="social-section" class="mt-8 animate-fade-in">
            <div class="relative flex py-2 items-center mb-4">
                <div class="flex-grow border-t border-white/10"></div>
                <span class="flex-shrink-0 mx-4 text-gray-600 text-[10px] uppercase tracking-widest font-bold">Ou continuer avec</span>
                <div class="flex-grow border-t border-white/10"></div>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <button onclick="handleSocial('google')" class="social-btn group">
                    <svg class="w-5 h-5 text-gray-400 group-hover:text-white transition" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/>
                    </svg>
                </button>
                <button onclick="handleSocial('apple')" class="social-btn group">
                    <svg class="w-5 h-5 text-gray-400 group-hover:text-white transition" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M14.25.18l.9.2.73.26.59.3.11.08.32.24.47.43.47.53c.22.28.33.5.31.64.26.33.48.74.63 1.22.28.93.33 1.93.14 2.92-.19.98-.6 1.84-1.17 2.52-.58.69-1.32 1.19-2.18 1.48-.87.29-1.83.39-2.82.28-1-.11-1.93-.42-2.71-.91-.77-.49-1.37-1.13-1.76-1.88-.4-.75-.58-1.61-.53-2.5.05-.9.32-1.74.79-2.48.47-.73 1.11-1.33 1.87-1.76.77-.43 1.63-.67 2.53-.7.9-.03 1.8.18 2.65.61l.5.28zm-3.29 2.2c-.36.43-.59 1.01-.59 1.65 0 .09.01.18.02.26.65-.05 1.25-.32 1.68-.76.38-.38.64-.93.64-1.57 0-.09-.01-.17-.02-.25-.66.07-1.28.35-1.73.67zm7.61 14.12c-.52 1.65-1.88 4.47-3.66 4.47-.56 0-1-.38-1.88-.38-.91 0-1.33.38-1.89.38-1.86 0-3.37-3.14-3.37-5.91 0-2.8 1.83-4.3 3.63-4.3.89 0 1.55.54 2.11.54.51 0 1.26-.59 2.27-.59 1.76 0 2.89 1.21 3.23 1.76-2.9 1.46-2.3 5.4 1.16 6.84-.25.86-.6 1.76-1.11 2.5l-.49.69z"/>
                    </svg>
                </button>
                <button onclick="handleSocial('facebook')" class="social-btn group">
                    <svg class="w-5 h-5 text-gray-400 group-hover:text-white transition" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v2.225l-.338-.006c-2.469-.045-2.755 1.646-2.755 2.921v1.944h2.68l-.915 3.667h-1.765v7.98h-5.374Z" />
                    </svg>
                </button>
            </div>
        </div>

        <p id="message" class="text-center text-xs mt-6 h-4 font-bold tracking-wide text-neon"></p>

    </div>

  <script src="/js/login.js"></script>

</body>
</html>
